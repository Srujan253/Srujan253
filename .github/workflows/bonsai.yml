name: Bonsai

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bonsai.yml
      - scripts/recolor.py

permissions:
  contents: write

concurrency:
  group: bonsai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: egorthinks/git-bonsai@bec04c39f62731fdb28c3b82322ef21cbf3bdfac
        with:
          commit: 'false'

      - name: Recolor bonsai palette
        run: python3 scripts/recolor.py output

      - name: Commit the bonsai if changed
        shell: bash
        run: |
          git config user.name "git-bonsai[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "bonsai unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: tend the bonsai 🌳"
          git pull --rebase origin main
          git push origin main
