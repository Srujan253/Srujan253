name: Koi

on:
  schedule:
    # Runs daily at 00:20 UTC to draw the previous day's activity
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency:
  group: koi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "koi: draw the day's koi"
          git pull --rebase origin main
          git push origin main
