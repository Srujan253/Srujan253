[package]
name = "git-falcon"
version = "0.1.0"
edition = "2021"
description = "Procedural pixel-art Falcon coding pet powered by GitHub and LeetCode activity"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gif = "0.13"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
